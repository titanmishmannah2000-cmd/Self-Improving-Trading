pair: BTC/USDT
version: "05"
# Layered sentient exits L0–L2 + sentient entries (L3+ alts via SENTIENT_ENTRY).
# require_clean_chart = no avoid/downtrend (wait_for_pullback does not veto Donchian).
# Frozen from reflect until sleeve_promote_n: entry_conviction_*, pullback_*, mr_*, sleeve_*.
strategy_type: donchian_breakout
regime_split: false
entry:
  direction: long
  donchian_period: 20
  interval: 4h
  period: 120d
  max_candles: 800
  breakout_buffer_pct: 0.4
  breakout_close_confirm: true
  breakout_confirm_bars: 1
  require_clean_chart: true
  session_filter: "24h"
stop_loss_pct: 2.5
# Also bump fixed TP to cover stop for non-relaxed RR paths / clarity.
profit_target_pct: 2.5
trailing_stop_pct: 0.3
time_exit_cycles: 480
early_reeval_cycles: 120
time_exit_max_cycles: 720
min_bank_net_pct: 0.10
peak_epsilon_pct: 0.05
mfe_stall_bars: 1
clock_lock_frac: 0.5
path_slack: 1.25
failed_breakout_bars: 1
partial_enabled: true
soft_partial_tp_frac: 0.4
mfe_giveback_min_pct: 0.35
mfe_giveback_frac: 0.4
trailing_atr_mult: 1.5
be_trigger_frac: 0.3
position_size_r: 0.15
atr_multiplier: 2.0
atr_floor_pct: 1.0
use_atr_floor: true
exit_tf: 4h
adx_threshold: 20
vol_threshold_pct: 0.01
vol_max_pct: 8.0
vol_min_pct: 0.005
minimum_entry_quality: 6
allow_bear_entries: false
# Sentient entry knobs (v05)
entry_conviction_take: 0.55
entry_conviction_probe: 0.40
entry_policy_min_n: 20
pullback_max_dist_pct: 2.0
pullback_cooldown_cycles: 30
pullback_stop_pct: 1.5
pullback_tp_pct: 2.0
mr_stop_pct: 2.0
mr_tp_pct: 2.5
sleeve_promote_n: 8
max_alt_entries_per_day: 2
idle_sleeve_cycles: 60
min_probe_size: 0.05
shadow_horizon_bars: 8

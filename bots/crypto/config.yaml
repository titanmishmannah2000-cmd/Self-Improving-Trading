# Crypto bot — BTC/USD + ETH/USD. Strategies are rsi_momentum (trend), not
# FX-style mean_reversion — same discipline as gold (D8).
# Profitability Path: same Phase 0–1 treatment as forex/gold (freeze + prove).
bot:
  name: crypto
pairs:
  - BTC/USD
  - ETH/USD
goal:
  failure_below: -10.0
  gemini_min_trades: 15
  gemini_reflection: true
  max_drawdown: 10.0
  min_sharpe: 1.0
  one_variable_only: true
  # Phase 3 cadence — same as forex/gold.
  reflection_every: 15
  target_return_30d: 5.0
# GP invent: hourly TF + short horizon. Tiny search so invent finishes
# and shows on Discovered. Promote stays gated (GP_PROMOTE off until Phase 4).
invent:
  interval: 1h
  period: 60d
  max_candles: 800
  horizon: 12
  generations: 12
  pop_size: 20
  n_islands: 1
  timeout_s: 240
  min_bars: 200
global:
  dashboard_url: ${DASHBOARD_API_URL}
  discord_webhook: ${DISCORD_ALERTS_WEBHOOK}
  fmp_key: ${FMP_KEY}
  llm_keys: {}

bot:
  name: gold
# Profitability Path Phase 0: XAU only (XAG parked until Phase 1 exit gate).
pairs:
  - XAU/USD
goal:
  target_return_30d: 5.0
  max_drawdown: 10.0
  min_sharpe: 1.0
  failure_below: -10.0
  # Phase 3: larger batch before reflection (was flat 5).
  reflection_every: 15
  one_variable_only: true
  gemini_reflection: true
  gemini_min_trades: 15
# GP invent: daily TF, medium forward horizon. Tiny search so invent finishes.
invent:
  interval: 1d
  period: 2y
  horizon: 20
  generations: 12
  pop_size: 20
  n_islands: 1
  timeout_s: 240
global:
  dashboard_url: ${DASHBOARD_API_URL}
  discord_webhook: ${DISCORD_ALERTS_WEBHOOK}
  llm_keys: {}
  fmp_key: ${FMP_KEY}

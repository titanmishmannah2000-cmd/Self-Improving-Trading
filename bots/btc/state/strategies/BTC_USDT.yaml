pair: BTC/USDT
version: "01"
# Strategy B v1 (BTC Focus Phase 3) — Donchian breakout on 4H.
# Economic rationale: BTC spends long stretches in directional expansions after
# volatility compresses; a prior-N high breakout on 4H captures continuation
# while the D1 SMA/ADX gate (entry.py) keeps the bot flat in chop/downtrends.
# GP invent is frozen (bots/btc invent.enabled=false) until ≥50 cost-aware trades.
strategy_type: donchian_breakout
# Honor YAML type — do not remap to MR / trend_follow sleeves.
regime_split: false
entry:
  direction: long
  donchian_period: 20
  interval: 4h
  period: 120d
  max_candles: 800
  session_filter: "24h"
stop_loss_pct: 2.0
profit_target_pct: 4.0
trailing_stop_pct: 0.0
time_exit_cycles: 150
mfe_giveback_min_pct: 0.4
mfe_giveback_frac: 0.5
trailing_atr_mult: 1.5
position_size_r: 0.2
atr_multiplier: 2.0
atr_floor_pct: 0.5
use_atr_floor: true
adx_threshold: 20
vol_threshold_pct: 0.01
vol_max_pct: 8.0
vol_min_pct: 0.005
minimum_entry_quality: 6
allow_bear_entries: false

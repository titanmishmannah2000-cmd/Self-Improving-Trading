bot:
  name: forex
# Profitability Path Phase 0: EUR + GBP only (GBP/JPY, AUD parked).
pairs:
  - EUR/USD
  - GBP/USD
goal:
  target_return_30d: 5.0
  max_drawdown: 10.0
  min_sharpe: 1.0
  failure_below: -10.0
  # Phase 3: larger batch before reflection (was flat 5).
  reflection_every: 15
  one_variable_only: true
  gemini_reflection: true
  gemini_min_trades: 15
# GP invent: daily TF, shorter forward horizon than the old global h=60.
# Tiny search + cooperative deadline so invent finishes and admits on Railway.
invent:
  interval: 1d
  period: 2y
  horizon: 10
  generations: 12
  pop_size: 20
  n_islands: 1
  timeout_s: 240
global:
  dashboard_url: ${DASHBOARD_API_URL}
  discord_webhook: ${DISCORD_ALERTS_WEBHOOK}
  llm_keys: {}
  fmp_key: ${FMP_KEY}
